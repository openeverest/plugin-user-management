replicaCount: 1

image:
  repository: ghcr.io/openeverest/plugin-user-management
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

plugin:
  displayName: "User Management"
  description: "Database users and their roles, databases and their owners, and API keys for models."
  vendor: "OpenEverest"
  enabled: true
  bundlePath: "/main.js"
  compatibleUiContractVersions: "^18.0.0"
  extensionPoints:
    - type: clusterDetailTab
      path: access
      label: Access
      # Providers the backend has a user-management engine for. The tab shows
      # their databases too where the engine manages them.
      providers:
        - percona-server-mongodb
        - provider-cloudnative-pg
        - provider-percona-postgresql
        - provider-kserve

# PostgreSQL options of databases (InstanceDatabase spec.postgresql).
postgresql:
  # Extensions users may create in a database, out of those the instance has.
  # Creating an extension runs as a superuser, so only allow extensions you
  # trust users with: ones that read server files, connect to other servers
  # or add untrusted languages (file_fdw, postgres_fdw, dblink, plpython3u,
  # ...) are as powerful as superuser access.
  extensions:
    # PostgreSQL's trusted extensions (pg_trgm, pgcrypto, uuid-ossp, hstore,
    # citext, ...), which a database's owner could create anyway.
    allowTrusted: true
    # Further extensions. Those that must be preloaded (timescaledb, ...) also
    # need the provider's setting for the instance.
    allowed:
      - vector
      - postgis
      - timescaledb
      - age
      - pg_stat_statements

# Optional override for the Everest API URL. When empty the backend discovers
# the everest Service via Kubernetes-injected env vars (same namespace), then
# falls back to http://everest.everest-system.svc.cluster.local:8080.
everestAPIURL: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 96Mi
