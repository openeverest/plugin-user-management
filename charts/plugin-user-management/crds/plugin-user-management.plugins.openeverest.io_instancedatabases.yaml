---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: instancedatabases.plugin-user-management.plugins.openeverest.io
spec:
  group: plugin-user-management.plugins.openeverest.io
  names:
    kind: InstanceDatabase
    listKind: InstanceDatabaseList
    plural: instancedatabases
    shortNames:
    - idb
    - idbs
    singular: instancedatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceRef.name
      name: Instance
      type: string
    - jsonPath: .spec.name
      name: Database
      type: string
    - jsonPath: .status.owner
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: InstanceDatabase is a database of an OpenEverest instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InstanceDatabaseSpec declares a database of an instance.
            properties:
              connect:
                default: Public
                description: |-
                  Connect tells who can connect to the database. Public, PostgreSQL's
                  default, lets every user connect, though only the owner and the users
                  granted a role on the database can use its objects. Granted lets only
                  those connect, besides superusers and the operator's own roles that
                  connect to every database, such as its connection pooler's.
                enum:
                - Public
                - Granted
                type: string
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy tells what deleting the InstanceDatabase does to the
                  database: Retain stops managing it and keeps its data, Delete drops it.
                enum:
                - Retain
                - Delete
                type: string
              instanceRef:
                description: InstanceRef is the Instance the database is created in.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              name:
                description: |-
                  Name of the database: lowercase letters, digits and underscores,
                  starting with a letter or an underscore.
                pattern: ^[a-z_][a-z0-9_]{0,62}$
                type: string
              owner:
                description: |-
                  Owner of the database. Changing it changes the owner of the database,
                  not of the objects in it.
                properties:
                  instanceUserRef:
                    description: |-
                      InstanceUserRef is an InstanceUser of the same instance; the database
                      is created once the user is Ready.
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - instanceUserRef
                type: object
            required:
            - instanceRef
            - name
            - owner
            type: object
            x-kubernetes-validations:
            - message: instanceRef is immutable
              rule: self.instanceRef == oldSelf.instanceRef
            - message: name is immutable
              rule: self.name == oldSelf.name
          status:
            description: InstanceDatabaseStatus is the observed state of an InstanceDatabase.
            properties:
              available:
                description: |-
                  Available is set once the database and the roles that grant access to
                  it have been applied. Users can be granted roles on it from then on,
                  even while it's Pending again, e.g. during an owner change.
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              declared:
                description: |-
                  Declared is set once the plugin has claimed the database name. A
                  database with the same name that exists before then is a conflict, so
                  an InstanceDatabase can't take over an existing database.
                type: boolean
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              owner:
                description: Owner is the username of the owner the database was last
                  declared with.
                type: string
              phase:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
