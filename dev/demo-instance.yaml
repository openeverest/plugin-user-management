apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: mongo-users
  namespace: um-test
spec:
  providerRef:
    name: percona-server-mongodb
  components:
    engine:
      type: mongod
      resources:
        limits:
          cpu: "1"
          memory: 2G
        requests:
          cpu: 300m
          memory: 1G
      replicas: 1
      storage:
        # 10Gi is the smallest volume some clouds (e.g. Linode) provision.
        size: 10Gi
